# MilliSec SOC - Splunk detection rules v1.0
# Deployed via deploy_splunk.ps1 (REST API). Do not edit in Splunk UI.

[CRITICAL - Canary Honeytoken Authentication]
search = index=wineventlog (EventCode=4624 OR EventCode=4625) (Account_Name=sqladmin OR Account_Name=repltest OR user=sqladmin) | stats count values(EventCode) AS codes values(ComputerName) AS host by _time, Account_Name
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 6
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = Account_Name

[HIGH - Honeypot IP Detected in Corporate Systems]
search = index=* NOT index=tpot [search index=tpot src_ip!=10.0.* src_ip!=172.16.* src_ip!=192.168.* | stats latest(src_ip) AS src_ip by src_ip | fields src_ip | rename src_ip AS client_ip | head 300] | stats count values(index) AS idx values(url) AS urls by client_ip
cron_schedule = 4-59/5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = client_ip

[HIGH - SQL Injection Attempt Blocked by WAF]
search = index=waf (waf_block_reason="*sql*" OR url="*union+select*" OR url="*%27+OR+1%3D1*" OR url="*sleep(*" OR url="*benchmark(*") | stats count values(url) AS urls values(waf_block_reason) AS reason dc(url) AS unique_urls by client_ip | where unique_urls > 0
cron_schedule = 2-57/5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = client_ip

[HIGH - XSS Attempt Blocked by WAF]
search = index=waf (waf_block_reason="*xss*" OR url="*script*alert*" OR url="*onerror*" OR url="*onload*" OR url="*javascript:alert*") | stats count values(url) AS urls by client_ip, user_agent
cron_schedule = 3-58/5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = client_ip

[HIGH - Sensitive File Access Attempt]
search = index=waf (url IN ("/.env","/.git/config","/wp-login.php","/wp-admin.php","/wp-admin/","/phpmyadmin/","/.aws/credentials","/.ssh/id_rsa","/server-status")) | stats count values(url) AS urls values(status) AS codes by client_ip
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = client_ip

[HIGH - API Brute Force Multiple 401]
search = index=api status=401 | stats count AS failures dc(url) AS targeted_endpoints by client_ip | where failures >= 10
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = client_ip

[MEDIUM - Impossible Travel Multi Country Logins]
search = (index=api OR index=waf) status=200 user=* user!="anonymous" | iplocation client_ip | stats dc(Country) AS countries values(Country) AS country_list earliest(_time) AS first_login latest(_time) AS last_login by user | where countries > 1 AND (last_login - first_login) < 3600
cron_schedule = 7-59/10 * * * *
dispatch.earliest = -10m
dispatch.latest = now
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = user

[HIGH - Potential DDoS Request Rate Spike]
search = index=waf | bin _time span=1m | stats count AS req_per_min by _time, client_ip | stats avg(req_per_min) AS avg_rpm max(req_per_min) AS max_rpm dc(_time) AS active_minutes by client_ip | where max_rpm > 100 AND active_minutes >= 3
cron_schedule = 6-59/5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = client_ip

[HIGH - Malware Attachment Quarantined]
search = index=mail ("Blocked INFECTED" OR "Blocked BANNED" OR "quarantine" OR amavis_score=*) ("INFECTED" OR "BANNED" OR ".exe" OR ".scr" OR ".vbs") | stats count values(recipient) AS rcpt values(sender) AS sndr by _time, host
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host

[HIGH - Malicious DNS Request Blocked]
search = index=pihole status=blocked OR "gravity blocked" | stats count values(domain) AS blocked_domains by client_ip
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = client_ip

[HIGH - Data Exfiltration Attempt via USB]
search = index=xdr (event_type=DeviceControl OR "usb" OR "removable") (blocked OR "copy" OR "write" OR denied) | stats count values(device) AS devices by ComputerName, user
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = ComputerName

[MEDIUM - Backup Job Failed]
search = index=* (source=*backup* OR "wbadmin" OR "System State") (failed OR "error" OR "unsuccessful" OR "aborted") | stats count values(source) AS src by host, _time
cron_schedule = 1-59/15 * * * *
dispatch.earliest = -15m
dispatch.latest = now
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = host

[CRITICAL - Ransomware Behavior Mass File Operations]
search = index=wineventlog (EventCode=4663 OR EventCode=4660) | bin _time span=5m | stats count AS file_ops by _time, ComputerName, Account_Name | where file_ops > 500
cron_schedule = */5 * * * *
dispatch.earliest = -5m
dispatch.latest = now
alert.track = 1
alert.severity = 6
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = ComputerName

[HIGH - New AD User Account Created]
search = index=wineventlog EventCode=4720 | stats count values(Security_ID) AS sid by _time, Account_Name, ComputerName, Src_User
cron_schedule = 5-59/10 * * * *
dispatch.earliest = -10m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = Account_Name

[HIGH - User Added to Privileged Group]
search = index=wineventlog (EventCode=4728 OR EventCode=4732 OR EventCode=4756) | stats count values(Group_Name) AS groups by _time, Account_Name, Src_User, ComputerName
cron_schedule = 5-59/10 * * * *
dispatch.earliest = -10m
dispatch.latest = now
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = Account_Name
